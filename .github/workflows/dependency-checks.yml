name: Dependency checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun ci

      - name: Check formatting
        run: bun run format:check

      - name: Check lint
        run: bun run lint:check

      - name: Check types
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      # GHSA-mrhx-c7xc-m3w5: zod 3.x has no patched release (fixed in 4.6.6, which we use directly).
      # The 3.x copy is pinned by exa-js (^3.22.0), which only validates with it in its tool-calling
      # helpers; we use search alone. Drop the ignore once exa-js moves to zod 4.
      - name: Audit dependencies
        run: bun audit --audit-level=high --ignore GHSA-mrhx-c7xc-m3w5
